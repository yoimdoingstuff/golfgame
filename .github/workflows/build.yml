name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: \${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Local network smoke test
        if: runner.os == 'Linux'
        run: sh ./scripts/test-local.sh
      - name: Package Windows prototype
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/golfgame.exe, build/Release/tg_net_demo.exe, README.md -DestinationPath golfgame-windows-x64.zip -Force
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: golfgame-windows-x64
          path: golfgame-windows-x64.zip
