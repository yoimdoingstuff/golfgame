name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package Windows prototype
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/golfgame.exe, build/Release/tg_net_demo.exe, README.md -DestinationPath golfgame-windows-x64.zip -Force
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: golfgame-windows-x64
          path: golfgame-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Local network smoke test
        run: sh ./scripts/test-local.sh
