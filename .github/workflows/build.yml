name: Build and visual checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build Windows game, networking demo and unit tests
        run: cmake --build build --config Release --target golf tg_net_demo golf_scorecard_tests golf_ball_collision_tests golf_spawn_layout_tests
      - name: Run scorecard, ball-collision and spawn-layout unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows game
        shell: pwsh
        run: |
          Compress-Archive -Path build/golfgame.exe, build/Release/tg_net_demo.exe, build/data, README.md, LICENSE, docs/THIRD_PARTY_NOTICES.md, vendor/Open-Golf/LICENSE -DestinationPath golfgame-windows-x64.zip -Force
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: golfgame-windows-x64
          path: golfgame-windows-x64.zip

  build-linux-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure networking-only build
        run: cmake -S . -B build -DGOLFGAME_BUILD_OPEN_GOLF=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build networking demo and unit tests
        run: cmake --build build --config Release --target tg_net_demo golf_scorecard_tests golf_ball_collision_tests
      - name: Run scorecard and ball-collision unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Local network smoke test
        run: sh ./scripts/test-local.sh

  build-linux-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install OpenGL, X11 and virtual-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxext-dev libxxf86vm-dev libgl1-mesa-dev libgl1-mesa-dri \
            libasound2-dev xvfb xdotool imagemagick mesa-utils x11-apps gdb
      - name: Configure Linux Open-Golf client
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build Linux game client
        run: |
          mkdir -p logs
          set -o pipefail
          cmake --build build --config Release --target golf 2>&1 | tee logs/build-linux-visual.txt
      - name: Validate generated Workshop course data
        run: python3 scripts/validate-workshop.py build/data
      - name: Capture UI checkpoints with Mesa software rendering
        run: |
          timeout 120s xvfb-run --auto-servernum --server-args="-screen 0 1600x900x24 +extension GLX +render -noreset" \
            env LIBGL_ALWAYS_SOFTWARE=1 bash ./scripts/capture-linux.sh
      - name: Capture Linux startup backtrace after visual failure
        if: failure()
        run: |
          set +e
          cd build
          timeout 30s xvfb-run --auto-servernum --server-args="-screen 0 1600x900x24 +extension GLX +render -noreset" \
            env LIBGL_ALWAYS_SOFTWARE=1 gdb --batch \
              -ex "set pagination off" \
              -ex run \
              -ex "thread apply all bt full" \
              --args ./golfgame > ../logs/gdb-startup.txt 2>&1
          echo "GDB exit: $?" >> ../logs/gdb-startup.txt
      - name: Upload visual logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golfgame-visual-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 30
